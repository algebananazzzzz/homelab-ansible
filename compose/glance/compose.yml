name: glance

services:
  glance:
    container_name: glance
    image: glanceapp/glance:latest
    environment:
      TZ: Asia/Singapore
      # Glance substitutes these into glance.yml itself.
      KANEO_HOSTNAME: ${KANEO_HOSTNAME}
      OUTLINE_HOSTNAME: ${OUTLINE_HOSTNAME}
    dns:
      - 10.10.10.10
    ports:
      - "8090:8080/tcp"
    volumes:
      - ./config/glance.yml:/app/config/glance.yml:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    restart: unless-stopped
