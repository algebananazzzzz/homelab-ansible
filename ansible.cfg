[defaults]
inventory = inventories/homelab/hosts.ini
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
roles_path = roles
collections_path = .ansible/collections
vars_plugins_enabled = host_group_vars,community.sops.sops

[privilege_escalation]
become = False
become_method = sudo

[ssh_connection]
pipelining = True
# Setting ssh_args replaces Ansible's defaults, so connection reuse must be listed explicitly.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o ServerAliveCountMax=3

[community.sops]
binary = .venv/bin/sops
