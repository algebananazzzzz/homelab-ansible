[defaults]
inventory = inventories/homelab/hosts.ini
interpreter_python = auto_silent
roles_path = roles
collections_path = .ansible/collections
gathering = explicit

[privilege_escalation]
become = True

[ssh_connection]
pipelining = True
# Setting ssh_args replaces Ansible's defaults, so connection reuse must be listed explicitly.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new
