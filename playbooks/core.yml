---
# Every VM resolves names through Pi-hole, so it comes first.
- name: Deploy Pi-hole
  hosts: pihole
  gather_facts: false
  become: true

  roles:
    - core/pihole

# Only after Pi-hole runs: mgmt-01 hosts it and would otherwise lose DNS on a fresh build.
- name: Point every VM at Pi-hole for DNS
  hosts: vm
  gather_facts: false
  become: true

  tasks:
    - name: Configure VM DNS
      ansible.builtin.include_role:
        name: vms/guest
        tasks_from: dns

- name: Deploy Consul server
  hosts: consul_server
  gather_facts: false
  become: true

  roles:
    - core/consul

- name: Deploy Consul agents
  hosts: vm:!consul_server
  gather_facts: false
  become: true

  roles:
    - core/consul

# Registers containers from their SERVICE_* labels, so stacks never write Consul definitions themselves.
- name: Deploy Consul registrator
  hosts: vm
  gather_facts: false
  become: true

  roles:
    - core/registrator

- name: Configure Tailscale
  hosts: tailscale
  gather_facts: true
  become: true

  roles:
    - core/tailscale
