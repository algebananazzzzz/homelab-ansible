---
# Every VM resolves names through Pi-hole, so it comes first.
- name: Deploy Pi-hole
  hosts: pihole
  gather_facts: false
  become: true

  roles:
    - core/pihole

- name: Deploy Consul server
  hosts: consul_server
  gather_facts: false
  become: true

  roles:
    - core/consul

- name: Deploy Consul agents
  hosts: vm:!consul_server
  gather_facts: false
  become: true

  roles:
    - core/consul

- name: Configure Tailscale
  hosts: tailscale
  gather_facts: true
  become: true

  roles:
    - core/tailscale
