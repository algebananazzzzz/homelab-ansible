---
- name: Back up state git cannot recreate
  hosts: backup
  gather_facts: false
  become: true

  roles:
    - backup

- name: Prune and check the backup repository
  hosts: backup_prune
  gather_facts: false
  become: true

  tasks:
    - name: Install the weekly prune
      ansible.builtin.include_role:
        name: backup
        tasks_from: prune
