---
# UGOS manages hv-01's containers and logs, so only the VMs get container metrics and log shipping.
- name: Deploy cAdvisor
  hosts: vm
  gather_facts: false
  become: true

  roles:
    - observability/cadvisor

- name: Ship journald logs to Loki
  hosts: vm
  gather_facts: false
  become: true

  roles:
    - observability/fluent_bit

- name: Install Node Exporter
  hosts: hypervisor:vm
  gather_facts: true
  become: true

  roles:
    - observability/node_exporter
