---
ansible_host: "{{ vm_definition.address }}"
ansible_ssh_common_args: -o ProxyCommand="ssh -p 2222 song@{{ hostvars['hv-01'].ansible_host }} nc %h %p"
compose_root: /opt/compose

consul_services:
  - { name: cadvisor, port: 8081, metrics_path: /metrics }
  - { name: fluent-bit, port: 2020, metrics_path: /api/v2/metrics/prometheus }
  - { name: node, port: 9100, metrics_path: /metrics }
consul_host_services: []
consul_server: false
