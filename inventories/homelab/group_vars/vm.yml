---
ansible_host: "{{ vm_definition.address }}"
compose_root: /opt/compose
vm_dns_server: 10.10.10.10

# mgmt-01's Tailscale subnet routes need a manual login and approval on a fresh build, so a rebuild runs site.yml with -e vm_via_hypervisor=true until they exist.
ansible_ssh_common_args: "{{ vm_hypervisor_proxy_args if vm_via_hypervisor | default(false) | bool else '' }}"
vm_hypervisor_proxy_args: >-
  -o ProxyCommand="ssh -p {{ hostvars[hypervisor_host].ansible_port }} {{ admin_user }}@{{ hostvars[hypervisor_host].ansible_host }} nc %h %p"
