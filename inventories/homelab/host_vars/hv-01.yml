---
# -e via_lan=true while the workstation has no Tailscale route to 10.10.10.0/24, such as on a fresh build.
ansible_host: "{{ '192.168.50.39' if via_lan | default(false) | bool else '10.10.10.1' }}"
ansible_port: 2222
backup_job: lab-vms

networks:
  - name: br-mgmt
    gateway: 10.10.10.1
    dns_server: 10.10.10.10
    public_dns_mac: '52:54:00:10:00:10'
  - name: br-svc
    gateway: 10.10.20.1
    dns_server: 10.10.10.10
  - name: br-lab
    gateway: 10.10.30.1
    dns_server: 8.8.8.8
    dhcp_start: 10.10.30.100
    dhcp_end: 10.10.30.199
    domain: lab.home.arpa
