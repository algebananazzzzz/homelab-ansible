---
uplink_interface: eth0
lan_address: 192.168.50.39/24
internal_cidr: 10.10.0.0/16

vms: "{{ (groups['vm'] + groups['lab']) | map('extract', hostvars, 'vm_definition') | list }}"

networks:
  - name: br-mgmt
    gateway: 10.10.10.1
    # mgmt-01 boots before Pi-hole exists on it.
    dns_server: 8.8.8.8
    reservations: "{{ vms | selectattr('network', 'equalto', 'br-mgmt') | selectattr('address', 'defined') | list }}"
  - name: br-svc
    gateway: 10.10.20.1
    dns_server: 10.10.10.10
    reservations: "{{ vms | selectattr('network', 'equalto', 'br-svc') | selectattr('address', 'defined') | list }}"
  - name: br-lab
    gateway: 10.10.30.1
    dns_server: 10.10.10.10
    dhcp_start: 10.10.30.100
    dhcp_end: 10.10.30.199
    domain: lab.home.arpa
