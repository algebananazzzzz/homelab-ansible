---
compose_projects:
  - name: kaneo
    consul:
      port: 5173
      hostnames:
        - "{{ public_hostnames.kaneo }}"
      health_path: /
    environment:
      KANEO_HOSTNAME: "{{ public_hostnames.kaneo }}"
      AUTH_HOSTNAME: "{{ public_hostnames.auth }}"
    secrets:
      - kaneo_auth_secret
      - postgres_password
    secret_environment:
      POSTGRES_PASSWORD: postgres_password
      AUTH_SECRET: kaneo_auth_secret
      CUSTOM_OAUTH_CLIENT_SECRET: kaneo_oidc_client_secret
  - name: outline
    consul:
      port: 3001
      hostnames:
        - "{{ public_hostnames.outline }}"
      health_path: /_health
    environment:
      OUTLINE_HOSTNAME: "{{ public_hostnames.outline }}"
      AUTH_HOSTNAME: "{{ public_hostnames.auth }}"
    secrets:
      - outline_secret_key
      - outline_utils_secret
      - postgres_password
      - redis_password
    secret_environment:
      SECRET_KEY: outline_secret_key
      UTILS_SECRET: outline_utils_secret
      OIDC_CLIENT_SECRET: outline_oidc_client_secret
      POSTGRES_PASSWORD: postgres_password
      REDIS_PASSWORD: redis_password
  - name: beaverhabits
    consul:
      port: 8082
      hostnames:
        - beaverhabits.svc.home.arpa
      health_path: /
    data_directories:
      - path: data
        owner: "65534"
        group: "65534"
        mode: "0750"
