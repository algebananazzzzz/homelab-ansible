---
authelia_oidc_clients:
  - id: outline
    name: Outline
    redirect_uri: "https://{{ public_hostnames.outline }}/auth/oidc.callback"
  - id: kaneo
    name: Kaneo
    redirect_uri: "https://{{ public_hostnames.kaneo }}/api/auth/oauth2/callback/custom"

compose_projects:
  - name: kaneo
    environment:
      KANEO_HOSTNAME: "{{ public_hostnames.kaneo }}"
      AUTH_HOSTNAME: "{{ public_hostnames.auth }}"
    secrets:
      - kaneo_auth_secret
      - postgres_password
    secret_environment:
      POSTGRES_PASSWORD: postgres_password
      AUTH_SECRET: kaneo_auth_secret
      CUSTOM_OAUTH_CLIENT_SECRET: kaneo_oidc_client_secret
  - name: authelia
    secrets:
      - authelia_session_secret
      - authelia_storage_encryption_key
      - authelia_jwt_secret
      - authelia_oidc_hmac_secret
      - postgres_password
      - redis_password
    secret_environment:
      SESSION_SECRET: authelia_session_secret
      STORAGE_ENCRYPTION_KEY: authelia_storage_encryption_key
      JWT_SECRET: authelia_jwt_secret
      OIDC_HMAC_SECRET: authelia_oidc_hmac_secret
      POSTGRES_PASSWORD: postgres_password
      REDIS_PASSWORD: redis_password
    templated_files:
      - config/configuration.yml
      - config/users_database.yml
  - name: outline
    environment:
      OUTLINE_HOSTNAME: "{{ public_hostnames.outline }}"
      AUTH_HOSTNAME: "{{ public_hostnames.auth }}"
    secrets:
      - outline_secret_key
      - outline_utils_secret
      - postgres_password
      - redis_password
    secret_environment:
      SECRET_KEY: outline_secret_key
      UTILS_SECRET: outline_utils_secret
      OIDC_CLIENT_SECRET: outline_oidc_client_secret
      POSTGRES_PASSWORD: postgres_password
      REDIS_PASSWORD: redis_password
  - name: beaverhabits
    data_directories:
      - path: data
        owner: "65534"
        group: "65534"
        mode: "0750"
