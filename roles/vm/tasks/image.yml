---
- name: Read host SSH public key
  ansible.builtin.slurp:
    src: "/home/{{ admin_user }}/.ssh/id_ed25519.pub"
  register: host_ssh_public_key_file

- name: Set shared image facts
  ansible.builtin.set_fact:
    image_directory: "{{ storage_root }}/images"
    base_image: "{{ storage_root }}/images/{{ image.name }}"
    vm_ssh_public_key: "{{ host_ssh_public_key_file.content | b64decode | trim }}"
    controller_ssh_public_key: "{{ lookup('ansible.builtin.file', '~/.ssh/id_ed25519.pub') | trim }}"

- name: Check host SSH public key
  ansible.builtin.assert:
    that:
      - vm_ssh_public_key is match('^ssh-(ed25519|rsa) ')
      - controller_ssh_public_key is match('^ssh-(ed25519|rsa) ')
    fail_msg: "Expected an SSH public key for {{ admin_user }} on host."

- name: Create image directory
  ansible.builtin.file:
    path: "{{ image_directory }}"
    state: directory
    owner: root
    group: kvm
    mode: "0755"

- name: Download base image
  ansible.builtin.get_url:
    url: "{{ image.url }}"
    dest: "{{ base_image }}"
    checksum: "sha512:{{ image.checksum }}"
    owner: root
    group: kvm
    mode: "0644"
