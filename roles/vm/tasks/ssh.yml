---
- name: Read host SSH public key
  ansible.builtin.slurp:
    src: "/home/{{ admin_user }}/.ssh/id_ed25519.pub"
  register: host_ssh_public_key_result

- name: Set SSH public keys for guest access
  ansible.builtin.set_fact:
    host_ssh_public_key: "{{ host_ssh_public_key_result.content | b64decode | trim }}"
    controller_ssh_public_key: "{{ lookup('ansible.builtin.file', '~/.ssh/id_ed25519.pub') | trim }}"

- name: Check host SSH public key
  ansible.builtin.assert:
    that:
      - host_ssh_public_key is match('^ssh-(ed25519|rsa) ')
    fail_msg: "Expected an SSH public key at /home/{{ admin_user }}/.ssh/id_ed25519.pub on the host."

- name: Check controller SSH public key
  ansible.builtin.assert:
    that:
      - controller_ssh_public_key is match('^ssh-(ed25519|rsa) ')
    fail_msg: "Expected an SSH public key at ~/.ssh/id_ed25519.pub on the Ansible controller."
