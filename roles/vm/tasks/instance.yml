---
- name: Check VM manifest
  ansible.builtin.assert:
    that:
      - vm.name is defined
      - vm.network is defined
      - vm.network in (networks | map(attribute='name') | list)
      - vm.mac is defined
      - vm.memory_mb is defined
      - vm.vcpus is defined
      - vm.disk_gb is defined
    fail_msg: VM manifest is incomplete or references an unknown network.

- name: Set VM paths
  ansible.builtin.set_fact:
    vm_directory: "{{ storage_root }}/{{ vm.name }}"
    vm_disk_path: "{{ storage_root }}/{{ vm.name }}/{{ vm.name }}.qcow2"
    vm_cloud_init_iso_path: "{{ storage_root }}/{{ vm.name }}/seed.iso"

- name: Create VM directory
  ansible.builtin.file:
    path: "{{ vm_directory }}"
    state: directory
    owner: root
    group: kvm
    mode: "0770"

- name: Prepare VM disk
  ansible.builtin.import_tasks: disk.yml

- name: Prepare cloud-init configuration
  ansible.builtin.import_tasks: cloud_init.yml

- name: Check whether VM is defined
  ansible.builtin.command:
    argv:
      - virsh
      - dominfo
      - "{{ vm.name }}"
  register: vm_domain_lookup_result
  changed_when: false
  failed_when: false
  check_mode: false

- name: Define and start VM
  ansible.builtin.command:
    argv:
      - virt-install
      - --name
      - "{{ vm.name }}"
      - --memory
      - "{{ vm.memory_mb }}"
      - --vcpus
      - "{{ vm.vcpus }}"
      - --cpu
      - host-passthrough
      - --os-variant
      - generic
      - --import
      - --disk
      - "path={{ vm_disk_path }},bus=virtio,format=qcow2"
      - --disk
      - "path={{ vm_cloud_init_iso_path }},device=cdrom"
      - --channel
      - unix,target_type=virtio,name=org.qemu.guest_agent.0
      - --network
      - "network={{ vm.network }},model=virtio,mac={{ vm.mac }}"
      - --graphics
      - none
      - --console
      - pty,target_type=serial
      - --noautoconsole
  when: vm_domain_lookup_result.rc != 0

- name: Read VM state and autostart setting
  ansible.builtin.command:
    argv:
      - virsh
      - dominfo
      - "{{ vm.name }}"
  register: vm_domain_info_result
  changed_when: false
  check_mode: false

- name: Enable VM at boot
  ansible.builtin.command:
    argv:
      - virsh
      - autostart
      - "{{ vm.name }}"
  when: vm_domain_info_result.stdout is not regex('(?m)^Autostart:\s+enable$')

- name: Start existing VM
  ansible.builtin.command:
    argv:
      - virsh
      - start
      - "{{ vm.name }}"
  when: vm_domain_info_result.stdout is not regex('(?m)^State:\s+running$')

- name: Use reserved VM address
  ansible.builtin.set_fact:
    vm_address: "{{ vm.address }}"
  when: vm.address is defined

- name: Wait for dynamic DHCP lease
  ansible.builtin.command:
    argv:
      - virsh
      - net-dhcp-leases
      - "{{ vm.network }}"
      - --mac
      - "{{ vm.mac }}"
  register: vm_dhcp_lease_result
  changed_when: false
  until: vm_dhcp_lease_result.stdout is regex('(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]+')
  retries: 60
  delay: 5
  when: vm.address is not defined

- name: Read dynamic VM address
  ansible.builtin.set_fact:
    vm_address: "{{ vm_dhcp_lease_result.stdout | regex_findall('((?:[0-9]{1,3}\\.){3}[0-9]{1,3})/[0-9]+') | first }}"
  when: vm.address is not defined

- name: Wait for VM SSH
  ansible.builtin.wait_for:
    host: "{{ vm_address }}"
    port: 22
    delay: 5
    timeout: 300

# Inventory derives ansible_host from a reserved address; a VM on a dynamic lease only has one after this.
- name: Record VM address for later plays
  ansible.builtin.add_host:
    name: "{{ vm.name }}"
    ansible_host: "{{ vm_address }}"
