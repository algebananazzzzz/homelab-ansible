name: cloudflared

services:
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:2026.9.1
    command:
      - tunnel
      - --no-autoupdate
      - --metrics=127.0.0.1:20241
      - --config=/etc/cloudflared/config.yml
      - run
    network_mode: host
    # The image defaults to a nonroot user that cannot read the root-owned 0600 credentials file.
    user: root
    volumes:
      - ./config/config.yml:/etc/cloudflared/config.yml:ro
      - ../secrets/cloudflared_credentials:/etc/cloudflared/credentials.json:ro
      - ../traefik/certs/ca.crt:/etc/cloudflared/ca.crt:ro
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
