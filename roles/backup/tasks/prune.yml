---
- name: Install the prune job
  ansible.builtin.copy:
    src: backup-prune
    dest: /usr/local/bin/
    mode: "0755"

- name: Install the prune service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
  loop: [backup-prune.service, backup-prune.timer]

- name: Seed the prune metrics
  ansible.builtin.command: /usr/local/bin/backup-metrics prune {{ backup_schedules.prune.max_age }} backup-prune.service
  args:
    creates: /var/lib/prometheus/node-exporter/backup-prune.prom
  environment:
    SERVICE_RESULT: success

- name: Enable the prune timer
  ansible.builtin.systemd_service:
    name: backup-prune.timer
    enabled: true
    state: started
    daemon_reload: true
