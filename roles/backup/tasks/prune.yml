---
- name: Install the prune job
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: backup-prune, dest: /usr/local/bin/, mode: "0755" }
    - { src: backup-prune.service, dest: /etc/systemd/system/, mode: "0644" }
    - { src: backup-prune.timer, dest: /etc/systemd/system/, mode: "0644" }

- name: Enable the prune timer
  ansible.builtin.systemd_service:
    name: backup-prune.timer
    enabled: true
    state: started
    daemon_reload: true
