---
- name: Install backup dependencies
  ansible.builtin.apt:
    name: "{{ ['bzip2', 'curl'] + (['sqlite3'] if backup_job == 'volumes' else []) }}"
    update_cache: true
    cache_valid_time: 3600

- name: Download restic
  ansible.builtin.get_url:
    url: https://github.com/restic/restic/releases/download/v{{ restic_version }}/restic_{{ restic_version }}_linux_amd64.bz2
    dest: /usr/local/src/
    checksum: sha256:{{ restic_sha256 }}

- name: Unpack restic
  ansible.builtin.shell: bunzip2 -c /usr/local/src/restic_{{ restic_version }}_linux_amd64.bz2 > /usr/local/lib/restic-{{ restic_version }} && chmod 0755 /usr/local/lib/restic-{{ restic_version }}
  args:
    creates: /usr/local/lib/restic-{{ restic_version }}

- name: Install restic
  ansible.builtin.file:
    src: /usr/local/lib/restic-{{ restic_version }}
    dest: /usr/local/bin/restic
    state: link
    force: true

- name: Create the restic config directory
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    mode: "0700"

- name: Write the restic environment
  ansible.builtin.template:
    src: env.j2
    dest: /etc/restic/env
    mode: "0600"
  no_log: true

- name: Initialise the shared restic repository
  ansible.builtin.shell: set -a; . /etc/restic/env; restic cat config > /dev/null 2>&1 || { restic init > /dev/null && echo initialised; }
  register: backup_repository
  changed_when: backup_repository.stdout == 'initialised'
  run_once: true

- name: Install the backup job and metrics writer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /usr/local/bin/
    mode: "0755"
  loop:
    - backup-{{ backup_job }}
    - backup-metrics

# Counts the install as a success, so a job that never runs still goes stale.
- name: Seed the backup metrics
  ansible.builtin.command: /usr/local/bin/backup-metrics {{ backup_job }} {{ backup_schedules[backup_job].max_age }} backup.service
  args:
    creates: /var/lib/prometheus/node-exporter/backup-{{ backup_job }}.prom
  environment:
    SERVICE_RESULT: success

- name: Install the backup service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
  loop: [backup.service, backup.timer]

- name: Enable the backup timer
  ansible.builtin.systemd_service:
    name: backup.timer
    enabled: true
    state: started
    daemon_reload: true
