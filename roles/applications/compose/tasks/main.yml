---
- name: Select Compose projects
  ansible.builtin.set_fact:
    selected_projects: "{{ requested_projects | rejectattr('name', 'in', absent_project_names) | list }}"
    absent_projects: "{{ requested_projects | selectattr('name', 'in', absent_project_names) | list }}"
  vars:
    requested_projects: "{{ compose_projects | selectattr('name', 'in', project_names | default(compose_projects | map(attribute='name') | list, true)) | list }}"
    absent_project_names: "{{ compose_projects | selectattr('absent', 'defined') | selectattr('absent') | map(attribute='name') | list }}"

- name: Write project secrets
  ansible.builtin.include_tasks: secrets.yml
  vars:
    secret_names: "{{ selected_projects | map(attribute='secrets', default=[]) | flatten | unique }}"

- name: Write project environment files
  ansible.builtin.include_tasks: environment.yml
  loop: "{{ selected_projects }}"
  loop_control:
    loop_var: project
    label: "{{ project.name }}"
  when: project.environment is defined or project.secret_environment is defined

- name: Deploy Compose projects
  ansible.builtin.include_tasks: deploy.yml
  loop: "{{ selected_projects }}"
  loop_control:
    loop_var: project
    label: "{{ project.name }}"

- name: Remove Compose projects marked absent
  ansible.builtin.include_tasks: remove.yml
  loop: "{{ absent_projects }}"
  loop_control:
    loop_var: project
    label: "{{ project.name }}"
