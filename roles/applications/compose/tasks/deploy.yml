---
- name: Create project directory
  ansible.builtin.file:
    path: "{{ compose_root }}/{{ project.name }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create project data directories
  ansible.builtin.file:
    path: "{{ compose_root }}/{{ project.name }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0750') }}"
  loop: "{{ project.data_directories | default([]) }}"

- name: Write Compose configuration
  ansible.builtin.copy:
    src: "{{ compose_source }}/{{ project.name }}/compose.yml"
    dest: "{{ compose_root }}/{{ project.name }}/compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Create project configuration directories
  ansible.builtin.file:
    path: "{{ compose_root }}/{{ project.name }}/{{ item | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ (project.files | default([])) + (project.templated_files | default([])) }}"
  when: (item | dirname | length) > 0

- name: Write project configuration
  ansible.builtin.copy:
    src: "{{ compose_source }}/{{ project.name }}/{{ item }}"
    dest: "{{ compose_root }}/{{ project.name }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ project.files | default([]) }}"
  register: project_configuration

- name: Write templated project configuration
  ansible.builtin.template:
    src: "{{ compose_source }}/{{ project.name }}/{{ item }}.j2"
    dest: "{{ compose_root }}/{{ project.name }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ project.templated_files | default([]) }}"
  register: project_templated_configuration

- name: Record project configuration state
  ansible.builtin.set_fact:
    project_configuration_changed: >-
      {{
        (project_configuration.changed | default(false))
        or (project_templated_configuration.changed | default(false))
      }}

- name: Apply Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/{{ project.name }}"
    remove_orphans: true
    wait: true
    # Compose hashes its own config but not bind-mounted files, so a changed
    # config file needs an explicit recreate.
    recreate: "{{ 'always' if project_configuration_changed else 'auto' }}"

- name: Register project with Consul
  ansible.builtin.include_role:
    name: management/consul
    tasks_from: register
  vars:
    consul_service: "{{ {'name': project.name} | combine(project.consul) }}"
  when: project.consul is defined
