---
- name: Read Authelia image from its Compose file
  ansible.builtin.set_fact:
    authelia_image: "{{ (lookup('ansible.builtin.file', 'compose.yml') | from_yaml).services.authelia.image }}"

- name: Create Authelia project directory
  ansible.builtin.file:
    path: "{{ compose_root }}/authelia"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create OIDC provider directory
  ansible.builtin.file:
    path: "{{ compose_root }}/authelia/oidc"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Generate OIDC signing key pair
  ansible.builtin.shell:
    cmd: |
      umask 077
      docker run --rm -v {{ compose_root }}/authelia/oidc:/keys \
        {{ authelia_image }} authelia crypto pair rsa generate --directory /keys
      chmod 644 private.pem public.pem
    chdir: "{{ compose_root }}/authelia/oidc"
    creates: "{{ compose_root }}/authelia/oidc/private.pem"

- name: Generate OIDC client secrets
  ansible.builtin.shell:
    cmd: |
      umask 077
      docker run --rm {{ authelia_image }} authelia crypto hash generate pbkdf2 \
        --variant sha512 --random --random.length 72 --random.charset rfc3986 > raw.txt
      grep 'Random Password:' raw.txt | sed 's/Random Password: //' > {{ client.id }}_client_secret.txt
      grep 'Digest:' raw.txt | sed 's/Digest: //' > {{ client.id }}_client_secret_hash.txt
      rm -f raw.txt
    chdir: "{{ compose_root }}/authelia/oidc"
    creates: "{{ compose_root }}/authelia/oidc/{{ client.id }}_client_secret.txt"
  loop: "{{ authelia_oidc_clients }}"
  loop_control:
    loop_var: client
    label: "{{ client.id }}"

- name: Require Authelia user password
  ansible.builtin.assert:
    that:
      - env_secrets.authelia_user_password | length > 0
    fail_msg: AUTHELIA_USER_PASSWORD is empty. Set it in the environment, for example by sourcing .env.

- name: Write Authelia user password
  ansible.builtin.copy:
    content: "{{ env_secrets.authelia_user_password }}"
    dest: "{{ compose_root }}/authelia/oidc/user_password.txt"
    owner: root
    group: root
    mode: "0600"
  register: user_password_file
  no_log: true

- name: Check Authelia user password hash
  ansible.builtin.stat:
    path: "{{ compose_root }}/authelia/oidc/user_password_hash.txt"
  register: user_password_hash_file

# Argon2 salts randomly, so hashing on every run would rewrite users_database.yml and recreate the container each deploy.
- name: Hash Authelia user password
  ansible.builtin.shell:
    cmd: |
      umask 077
      docker run --rm {{ authelia_image }} authelia crypto hash generate argon2 \
        --password "$(cat user_password.txt)" > raw.txt
      grep 'Digest:' raw.txt | sed 's/Digest: //' > user_password_hash.txt
      rm -f raw.txt
    chdir: "{{ compose_root }}/authelia/oidc"
  when: user_password_file.changed or not user_password_hash_file.stat.exists
  no_log: true

- name: Copy OIDC client secrets to shared secrets
  ansible.builtin.copy:
    src: "{{ compose_root }}/authelia/oidc/{{ client.id }}_client_secret.txt"
    dest: "{{ compose_root }}/secrets/{{ client.id }}_oidc_client_secret"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  loop: "{{ authelia_oidc_clients }}"
  loop_control:
    loop_var: client
    label: "{{ client.id }}"

- name: Read generated OIDC artifacts
  ansible.builtin.slurp:
    src: "{{ compose_root }}/authelia/oidc/{{ item }}"
  loop:
    - private.pem
    - user_password_hash.txt
  register: oidc_artifacts

- name: Read OIDC client secret hashes
  ansible.builtin.slurp:
    src: "{{ compose_root }}/authelia/oidc/{{ client.id }}_client_secret_hash.txt"
  loop: "{{ authelia_oidc_clients }}"
  loop_control:
    loop_var: client
    label: "{{ client.id }}"
  register: oidc_client_hashes

- name: Set Authelia template facts
  ansible.builtin.set_fact:
    authelia_jwks_private_key: "{{ oidc_artifacts.results[0].content | b64decode }}"
    authelia_user_password_hash: "{{ (oidc_artifacts.results[1].content | b64decode) | trim }}"
    authelia_client_secret_hashes: >-
      {{ dict(authelia_oidc_clients | map(attribute='id') | zip(oidc_client_hashes.results | map(attribute='content') | map('b64decode') | map('trim'))) }}

- name: Write Authelia secrets
  ansible.builtin.include_role:
    name: applications/compose
    tasks_from: secrets
  vars:
    secret_names:
      - authelia_session_secret
      - authelia_storage_encryption_key
      - authelia_jwt_secret
      - authelia_oidc_hmac_secret
      - postgres_password
      - redis_password

- name: Write Authelia environment file
  ansible.builtin.include_role:
    name: applications/compose
    tasks_from: environment
  vars:
    project:
      name: authelia
      secret_environment:
        SESSION_SECRET: authelia_session_secret
        STORAGE_ENCRYPTION_KEY: authelia_storage_encryption_key
        JWT_SECRET: authelia_jwt_secret
        OIDC_HMAC_SECRET: authelia_oidc_hmac_secret
        POSTGRES_PASSWORD: postgres_password
        REDIS_PASSWORD: redis_password

- name: Create Authelia config directory
  ansible.builtin.file:
    path: "{{ compose_root }}/authelia/config"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write Authelia Compose file
  ansible.builtin.copy:
    src: compose.yml
    dest: "{{ compose_root }}/authelia/compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Write Authelia configuration
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ compose_root }}/authelia/config/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - configuration.yml
    - users_database.yml
  register: authelia_configuration

- name: Start Authelia
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/authelia"
    remove_orphans: true
    wait: true
    # Authelia reads its configuration only at startup.
    recreate: "{{ 'always' if authelia_configuration.changed else 'auto' }}"

- name: Register Authelia with Consul
  ansible.builtin.include_role:
    name: core/consul
    tasks_from: register
  vars:
    consul_service:
      name: authelia
      port: 9091
      hostnames:
        - auth.home.arpa
        - "{{ public_hostnames.auth }}"
      health_path: /api/health
