---
- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ tls_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Generate certificate authority key and certificate
  ansible.builtin.shell:
    cmd: |
      umask 077
      openssl genrsa -out ca.key 4096
      openssl req -x509 -new -nodes -key ca.key -sha256 -days 3650 \
        -subj "/CN=HomeLab Internal CA" -out ca.crt
    chdir: "{{ tls_directory }}"
    creates: "{{ tls_directory }}/ca.crt"

- name: Remove server certificate that lacks a requested domain
  ansible.builtin.shell:
    cmd: |
      [ -f server.crt ] || exit 0
      sans=$(openssl x509 -in server.crt -noout -ext subjectAltName)
      missing=
      {% for domain in tls_certificate_domains %}
      printf '%s' "$sans" | grep -qF 'DNS:{{ domain }}' || missing=1
      {% endfor %}
      [ -n "$missing" ] || exit 0
      rm -f server.crt server.key
      echo changed
    chdir: "{{ tls_directory }}"
  register: server_certificate_reset
  changed_when: server_certificate_reset.stdout == 'changed'

- name: Generate server certificate signed by the certificate authority
  vars:
    certificate_san: "{{ tls_certificate_domains | map('regex_replace', '^(.*)$', 'DNS:\\1') | join(',') }}"
  ansible.builtin.shell:
    cmd: |
      umask 077
      openssl genrsa -out server.key 2048
      printf 'subjectAltName={{ certificate_san }}\n' > ext.cnf
      openssl req -new -key server.key -subj "/CN={{ tls_certificate_domains[0] }}" \
        -addext "subjectAltName={{ certificate_san }}" -out server.csr
      openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
        -days 1825 -sha256 -extfile ext.cnf -out server.crt
      rm -f server.csr ext.cnf
    chdir: "{{ tls_directory }}"
    creates: "{{ tls_directory }}/server.crt"
  register: server_certificate

- name: Record server certificate state
  ansible.builtin.set_fact:
    tls_certificate_changed: "{{ server_certificate_reset.changed or server_certificate.changed }}"
