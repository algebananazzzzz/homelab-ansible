---
- name: Create Consul agent directory
  ansible.builtin.file:
    path: "{{ compose_root }}/consul-agent"
    state: directory
    owner: root
    group: root
    mode: "0750"

# Other roles add service definitions here through register.yml.
- name: Create Consul agent config directory
  ansible.builtin.file:
    path: "{{ compose_root }}/consul-agent/config"
    state: directory
    owner: root
    group: root
    mode: "0755"

# A client agent leaves the cluster on SIGTERM by default, which deletes its node and services from the catalog;
# Prometheus then loses the targets instead of seeing them down, so a cleanly stopped VM never pages.
- name: Keep a stopped agent's node in the catalog
  ansible.builtin.copy:
    dest: "{{ compose_root }}/consul-agent/config/agent.hcl"
    content: |
      leave_on_terminate = false
    owner: root
    group: root
    mode: "0644"
  register: consul_agent_configuration

- name: Write Consul agent Compose file
  ansible.builtin.copy:
    src: agent-compose.yml
    dest: "{{ compose_root }}/consul-agent/compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Start Consul agent
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/consul-agent"
    remove_orphans: true
    wait: true

- name: Restart Consul agent for its configuration
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/consul-agent"
    state: restarted
  when: consul_agent_configuration.changed
