---
- name: Check management host identity
  ansible.builtin.assert:
    that:
      - ansible_facts.hostname == 'mgmt-01'
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == '12'
    fail_msg: Refusing to configure an unexpected management host.

- name: Install Tailscale signing key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
  register: tailscale_signing_key

- name: Install Tailscale repository
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/bookworm.tailscale-keyring.list
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: "0644"
  register: tailscale_repository

- name: Check Tailscale package metadata
  ansible.builtin.command:
    argv:
      - apt-cache
      - show
      - tailscale
  register: tailscale_package
  changed_when: false
  failed_when: false

- name: Update package metadata
  ansible.builtin.apt:
    update_cache: true
  when: tailscale_signing_key.changed or tailscale_repository.changed or tailscale_package.rc != 0

- name: Install management packages
  ansible.builtin.apt:
    name:
      - git
      - tailscale
    state: present

- name: Remove tailnet DNS relay
  ansible.builtin.apt:
    name: dnsmasq
    state: absent
    purge: true
    autoremove: true

- name: Remove tailnet DNS relay configuration
  ansible.builtin.file:
    path: /etc/dnsmasq.d/homelab.conf
    state: absent

- name: Enable Tailscale service
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
    state: started

- name: Persist subnet router forwarding
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale.conf
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
    owner: root
    group: root
    mode: "0644"
  register: tailscale_sysctl

- name: Enable subnet router forwarding
  ansible.builtin.command:
    argv:
      - /usr/sbin/sysctl
      - -p
      - /etc/sysctl.d/99-tailscale.conf
  when: tailscale_sysctl.changed

- name: Read Tailscale preferences
  ansible.builtin.command:
    argv:
      - tailscale
      - debug
      - prefs
  register: tailscale_preferences
  changed_when: false

- name: Advertise homelab routes
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - "--advertise-routes={{ tailscale_advertised_routes | join(',') }}"
  when: (tailscale_preferences.stdout | from_json).AdvertiseRoutes | sort != tailscale_advertised_routes | sort
