name: fluent-bit

services:
  fluent-bit:
    container_name: fluent-bit
    image: fluent/fluent-bit:5.1.3
    entrypoint: ["/fluent-bit/bin/fluent-bit"]
    command: ["-c", "/fluent-bit/etc/fluent-bit.yaml"]
    network_mode: host
    volumes:
      - ./fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - ./level.lua:/fluent-bit/etc/level.lua:ro
      # Off hv-01's /volume1, where UGOS's indexer logs every write and Fluent Bit would ship its own echo.
      - /var/lib/fluent-bit:/fluent-bit/state
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    restart: unless-stopped
