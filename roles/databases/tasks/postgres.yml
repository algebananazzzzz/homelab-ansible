---
- name: "Create PostgreSQL database {{ database.name }}"
  ansible.builtin.shell:
    cmd: |
      set -eu
      password=$(cat {{ compose_root }}/secrets/{{ server.password_secret }})
      if docker exec -e PGPASSWORD="$password" {{ server.container }} psql -U {{ server.admin_user }} -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='{{ database.name }}'" | grep -q 1; then
        exit 0
      fi
      docker exec -e PGPASSWORD="$password" {{ server.container }} psql -U {{ server.admin_user }} -d postgres -c "CREATE DATABASE {{ database.name }}"
      echo changed
  register: postgres_database
  changed_when: postgres_database.stdout_lines | last | default('') == 'changed'
  no_log: true
  vars:
    server: "{{ database_servers.postgres }}"
