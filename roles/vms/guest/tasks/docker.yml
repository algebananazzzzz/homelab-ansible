---
- name: Check Docker installation
  ansible.builtin.command:
    argv:
      - docker
      - version
      - --format
      - "{{ '{{' }}.Server.Version{{ '}}' }}"
  register: docker_installation
  changed_when: false
  failed_when: false

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
  when: docker_installation.rc != 0

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_installation.rc != 0

- name: Install Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  when: docker_installation.rc != 0

- name: Read package architecture
  ansible.builtin.command:
    argv:
      - dpkg
      - --print-architecture
  register: package_architecture
  changed_when: false
  when: docker_installation.rc != 0

- name: Install Docker repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_facts.distribution_release }}
      Components: stable
      Architectures: {{ package_architecture.stdout }}
      Signed-By: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  when: docker_installation.rc != 0

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: docker_installation.rc != 0

- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
  when: docker_installation.rc != 0

- name: Create Compose root
  ansible.builtin.file:
    path: "{{ compose_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create secrets directory
  ansible.builtin.file:
    path: "{{ compose_root }}/secrets"
    state: directory
    owner: root
    group: root
    mode: "0700"
