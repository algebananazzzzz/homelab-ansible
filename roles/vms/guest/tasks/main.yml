---
- name: Trust VM host key
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - BatchMode=yes
      - -o
      - StrictHostKeyChecking=accept-new
      - -o
      - >-
        ProxyCommand=ssh -p {{ hostvars[hypervisor_host].ansible_port }}
        {{ admin_user }}@{{ hostvars[hypervisor_host].ansible_host }} nc %h %p
      - "{{ admin_user }}@{{ ansible_host }}"
      - "true"
  delegate_to: localhost
  become: false
  changed_when: false

# Docker's apt repository is chosen by distribution release.
- name: Gather VM facts
  ansible.builtin.setup:

# Installed here, not by cloud-init, because a VM may boot before Pi-hole can resolve for it.
- name: Install guest packages
  ansible.builtin.apt:
    name:
      - git
      - qemu-guest-agent
    state: present
    update_cache: true

- name: Start QEMU guest agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    state: started

- name: Install Docker
  ansible.builtin.import_tasks: docker.yml
