---
- name: Check host identity
  ansible.builtin.assert:
    that:
      - ansible_facts.hostname == hostname
      - ansible_facts.distribution == "Debian"
      - ansible_facts.distribution_major_version == "12"
    fail_msg: Refusing to manage an unexpected host.

- name: Read LAN address
  ansible.builtin.command:
    argv:
      - ip
      - -4
      - -o
      - address
      - show
      - dev
      - "{{ uplink_interface }}"
  register: uplink_addresses
  changed_when: false
  check_mode: false

- name: Check LAN address
  ansible.builtin.assert:
    that:
      - lan_address in uplink_addresses.stdout
    fail_msg: "Expected {{ lan_address }} on {{ uplink_interface }}."

- name: Check required tools
  ansible.builtin.command:
    argv:
      - "{{ item }}"
      - --version
  loop:
    - docker
    - virsh
  changed_when: false
  check_mode: false
