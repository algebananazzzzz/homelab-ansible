---
- name: Create project directory
  ansible.builtin.file:
    path: "{{ compose_root }}/{{ project.name }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write secret environment file
  ansible.builtin.shell:
    cmd: |
      environment_file=$(mktemp {{ compose_root }}/{{ project.name }}/.env.XXXXXX)
      chmod 0600 "$environment_file"
      {% for variable, secret in project.secret_environment.items() %}
      printf '%s=%s\n' '{{ variable }}' "$(cat {{ compose_root }}/secrets/{{ secret }})" >> "$environment_file"
      {% endfor %}
      if cmp --silent "$environment_file" {{ compose_root }}/{{ project.name }}/.env 2>/dev/null; then
        rm "$environment_file"
      else
        mv "$environment_file" {{ compose_root }}/{{ project.name }}/.env
        echo changed
      fi
  register: project_environment
  changed_when: project_environment.stdout == 'changed'
  no_log: true
