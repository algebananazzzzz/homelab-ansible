---
- name: Install Docker
  ansible.builtin.import_tasks: install.yml
  tags:
    - install

- name: Check Docker
  ansible.builtin.import_tasks: check.yml
  tags:
    - check

- name: Select Compose projects
  ansible.builtin.set_fact:
    selected_project_names: "{{ project_names | default(compose_projects | map(attribute='name') | list, true) }}"

- name: Check requested Compose projects
  ansible.builtin.assert:
    that:
      - selected_project_names | difference(compose_projects | map(attribute='name') | list) | length == 0
    fail_msg: One or more requested Compose projects are not assigned to this host.

- name: Select project definitions
  ansible.builtin.set_fact:
    selected_projects: "{{ compose_projects | selectattr('name', 'in', selected_project_names) | list }}"

- name: Create Compose root
  ansible.builtin.file:
    path: "{{ compose_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: selected_projects | length > 0

- name: Create secrets directory
  ansible.builtin.file:
    path: "{{ compose_root }}/secrets"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: selected_projects | map(attribute='secrets', default=[]) | flatten | length > 0

- name: Generate static service secrets
  ansible.builtin.copy:
    content: "{{ static_secret_values[item] }}"
    dest: "{{ compose_root }}/secrets/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ selected_projects | map(attribute='secrets', default=[]) | flatten | unique | intersect(static_secret_values.keys() | list) }}"
  no_log: true

- name: Generate random service secrets
  ansible.builtin.shell:
    cmd: >-
      umask 077;
      openssl rand -hex 32 > {{ compose_root }}/secrets/{{ item }}
    creates: "{{ compose_root }}/secrets/{{ item }}"
  loop: "{{ selected_projects | map(attribute='secrets', default=[]) | flatten | unique | difference(static_secret_values.keys() | list) }}"

- name: Generate project TLS certificates
  ansible.builtin.include_role:
    name: tls
    allow_duplicates: true
  loop: "{{ selected_projects | selectattr('certificate', 'defined') | list }}"
  loop_control:
    loop_var: project
    label: "{{ project.name }}"

- name: Generate project OIDC provider secrets
  ansible.builtin.include_role:
    name: oidc
    allow_duplicates: true
  loop: "{{ selected_projects | selectattr('oidc_provider', 'defined') | list }}"
  loop_control:
    loop_var: project
    label: "{{ project.name }}"

- name: Read Cloudflare tunnel credentials
  ansible.builtin.include_role:
    name: cloudflared
  when: selected_projects | selectattr('tunnel_hostnames', 'defined') | list | length > 0

- name: Trust internal certificate authority
  ansible.builtin.include_role:
    name: ca_trust
  when: inventory_hostname in groups['internal_ca_trust_hosts']

- name: Write project environment files
  ansible.builtin.include_tasks: environment.yml
  loop: "{{ selected_projects | selectattr('secret_environment', 'defined') | list }}"
  loop_control:
    loop_var: project
    label: "{{ project.name }}"

- name: Deploy Compose projects
  ansible.builtin.include_tasks: deploy.yml
  loop: "{{ selected_projects }}"
  loop_control:
    loop_var: project
    label: "{{ project.name }}"
